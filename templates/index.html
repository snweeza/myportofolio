<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device=width, initial-scale=1.0">
        <Title>Nafeeza Arwatabina - Portofolio</Title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
                    <div class="container-nav">
                        <nav class="folder-nav">
                            <a href="{% url 'main:show_main' %}">Profile</a>
                        </nav>
                        <nav class="folder-nav">
                            <a href="{% url 'main:show_experience' %}">Experience</a>
                        </nav>
                        <nav class="folder-nav">
                            <a href="{% url 'main:show_techstack' %}">Skills</a>
                        </nav>
                </div>
            </div>
        </header>

        <main>
            <section class="hero" id="profile">
                <div class="container hero-block">
                    <div class="container hero-grid">
                        <header class="hero-header">
                            <p class ="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                        </header>
                        <div class="hero-identity">
                            <h1>{{name}}</h1>
                        </div>
                        <div class="hero-photo">
                            <img class="avatar" src="/static/img/Selca_Nafeeza.jpeg" alt ="Photo of {{name}}">
                        </div>
                        <div class ="hero-details">
                            <p class="bio"> {{ bio }}</p>
                            <dl class ="meta-list">
                                <div class="meta-row">
                                    <dt>NPM</dt>
                                    <dd>{{npm}}</dd>
                                </div>
                                <div class="meta-row">
                                    <dt> Program</dt>
                                    <dd>{{study_program}}</dd>
                    
                                </div>
                            </dl>
                            <div class="social-links">
                                <a href="https://github.com/snweeza" class="social-link">GitHub</a>
                                <a href="https://linkedin.com/" class="social-link">LinkedIn</a>
                                <a href="nafeeza.arwatabina@ui.ac.id" class="social-link">Email</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 {{name}}. Fakultas Ilmu Komputer, Universitas Indonesia</p>
            </div>
        </footer>
    </body>
</html>
