{% extends 'base.html' %}

{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-block">
                <div class="hero-grid">
                    <header class="hero-header">
                        <p class ="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    </header>
                    <div class="hero-identity">
                        <h1>{{name}}</h1>
                    </div>
                    <div class="hero-photo">
                        <img class="avatar" src="/static/img/Selca_Nafeeza.jpeg" alt ="Photo of {{name}}">
                    </div>
                    <div class ="hero-details">
                        <p class="bio"> {{ bio }}</p>
                        <dl class ="meta-list">
                            <div class="meta-row">
                                <dt>NPM</dt>
                                <dd>{{npm}}</dd>
                            </div>
                            <div class="meta-row">
                                <dt> Program</dt>
                                <dd>{{study_program}}</dd>
                            </div>
                            <div class="meta-row">
                                <dt>Sesi Terakhir Login</dt>
                                <dd>{{ last_login }}</dd>
                            </div>
                        </dl>
                        <div class="social-links">
                            <a href="https://github.com/snweeza" class="social-link">GitHub</a>
                            <a href="https://linkedin.com/" class="social-link">LinkedIn</a>
                            <a href="nafeeza.arwatabina@ui.ac.id" class="social-link">Email</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
