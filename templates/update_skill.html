{% extends "base.html" %}
{% block meta %}
    <title>Update Skill - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <section class="experience-section">
        <div class="container">
            <h1 class="judul-container">Update Skill</h1>
            <form method="post"
                action="{% url 'main:update_skill' skill.id %}"
                class="experience-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="button">Update Skill</button>
                <a href="{% url 'main:show_skills' %}" class="button button-secondary">Batal</a>
            </form>
        </div>
    </section>
    </main>
{% endblock content %}
